[package]
name = "hasse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
hound = "3.5.1"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
realfft = "3.5.1"
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_Media_Audio", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.7.0"
core-graphics = "0.25.0"
eframe = "0.37.0"
libc = "0.2"
rdev = "0.5.3"
